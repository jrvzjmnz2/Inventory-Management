<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · Equipment Inventory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <img class="login-logo" src="assets/logos/full-logo-color.png" alt="ITEMHOUND">
    <h1>Equipment Inventory</h1>
    <p class="subtitle">New Employee Registration</p>

    <form id="registerForm">
      <label for="regId">Employee ID</label>
      <input type="text" id="regId" required>

      <label for="regName">Full Name</label>
      <input type="text" id="regName" required>

      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" required>

      <label for="regAccessCode">Access Code</label>
      <input type="password" id="regAccessCode" autocomplete="off" required>

      <button type="submit">Register</button>
      <p id="registerError" class="error-text"></p>
      <p id="registerSuccess" class="success-text"></p>
    </form>
    <p class="subtitle">Already registered? Sign in from the AI Hub.</p>
  </div>

  <div id="registerSuccessPopup" class="success-popup hidden">
    <div class="success-popup-card">
      <div class="success-popup-icon">✓</div>
      <p class="success-popup-text">Account Created Successfully</p>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
